[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -D_IR_ENABLE_DEFAULT_=false
  -DDECODE_NEC=true
  -DSEND_NEC=true
lib_deps =
  crankyoldgit/IRremoteESP8266@2.9.0
  adafruit/Adafruit BusIO@1.17.4

; Compile-only validation profile. These pins are illustrative, not a wiring
; recommendation: never upload this profile without reviewing actual hardware.
[env:esp32dev-peripherals-build]
extends = env:esp32dev
build_flags =
  ${env:esp32dev.build_flags}
  -DMAEN_SD_SCK=18
  -DMAEN_SD_MISO=19
  -DMAEN_SD_MOSI=23
  -DMAEN_SD_CS=27
  -DMAEN_LF_RX=34
  -DMAEN_IR_RX=35
  -DMAEN_IR_TX=33
  -DMAEN_NFC_SDA=21
  -DMAEN_NFC_SCL=22
  -DMAEN_NFC_IRQ=36
  -DMAEN_NFC_RESET=25
  -DMAEN_RF_SCK=16
  -DMAEN_RF_MISO=39
  -DMAEN_RF_MOSI=17
  -DMAEN_RF_CS=26
